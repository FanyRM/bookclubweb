<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Páginas — Club del Libro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
  </head>
  <body>
    <nav>
      <div class="nav-logo" onclick="navigate('home')">
        <span>BOOK Club</span>
      </div>

      <div class="nav-links">
        <span class="nav-link" onclick="navigate('libros')">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
            />
          </svg>
          Libros
        </span>
        <span class="nav-link" onclick="navigate('criticas')">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          Reseñas
        </span>
        <span class="nav-link" onclick="navigate('reuniones')">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          Reuniones
        </span>

        <div class="nav-user" id="navUser" style="display: none">
          <div
            class="avatar-sm"
            id="navAvatar"
            onclick="navigate('mi-perfil')"
            title="Mi perfil"
          ></div>
          <button class="nav-btn-logout" onclick="logout()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Salir
          </button>
        </div>

        <div
          id="navAuth"
          style="display: flex; gap: 0.5rem; align-items: center"
        >
          <button class="nav-btn-login" onclick="navigate('login')">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Ingresar
          </button>
          <button class="nav-btn-register" onclick="navigate('registro')">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
              <line x1="19" y1="8" x2="19" y2="14" />
              <line x1="22" y1="11" x2="16" y2="11" />
            </svg>
            Registrarse
          </button>
        </div>
      </div>

      <button
        class="nav-hamburger"
        id="navHamburger"
        aria-label="Abrir menú"
        onclick="toggleDrawer()"
      >
        <span></span><span></span><span></span>
      </button>
    </nav>

    <div class="nav-drawer" id="navDrawer">
      <span
        class="nav-link"
        onclick="
          navigate('libros');
          closeDrawer();
        "
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path
            d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
          />
        </svg>
        Libros
      </span>
      <span
        class="nav-link"
        onclick="
          navigate('criticas');
          closeDrawer();
        "
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
        Reseñas
      </span>
      <span
        class="nav-link"
        onclick="
          navigate('reuniones');
          closeDrawer();
        "
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Reuniones
      </span>

      <hr class="drawer-divider" />

      <!-- Logged-in state -->
      <div class="drawer-user" id="drawerUser" style="display: none">
        <div
          class="avatar-sm"
          id="drawerAvatar"
          onclick="
            navigate('mi-perfil');
            closeDrawer();
          "
        ></div>
        <span class="drawer-user-info" id="drawerUserName">Mi perfil</span>
      </div>

      <!-- Auth buttons -->
      <div class="drawer-auth" id="drawerAuth">
        <button
          class="nav-btn-login"
          onclick="
            navigate('login');
            closeDrawer();
          "
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <polyline points="10 17 15 12 10 7" />
            <line x1="15" y1="12" x2="3" y2="12" />
          </svg>
          Ingresar
        </button>
        <button
          class="nav-btn-register"
          onclick="
            navigate('registro');
            closeDrawer();
          "
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Registrarse
        </button>
      </div>

      <!-- Logout (shown when logged in) -->
      <div id="drawerLogout" style="display: none">
        <button
          class="nav-btn-logout"
          style="width: 100%; justify-content: center"
          onclick="
            logout();
            closeDrawer();
          "
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>

    <!-- ═══════════════════════ TOAST ═══════════════════════ -->
    <div class="toast" id="toast"></div>

    <!-- ═══════════════════════ VIEWS ═══════════════════════ -->
    <main id="app"></main>

    <!-- ═══════════════════════ MODALS ══════════════════════ -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modalBox">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Modal</div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>

    <!-- ═══════════════════ Core Scripts ════════════════════ -->
    <script src="{{ url_for('static', filename='js/state.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <!-- View Scripts -->
    <script src="{{ url_for('static', filename='js/views/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/views/home.js') }}"></script>
    <script src="{{ url_for('static', filename='js/libros.js') }}"></script>
    <script src="{{ url_for('static', filename='js/criticas.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reuniones.js') }}"></script>
    <script src="{{ url_for('static', filename='js/perfil.js') }}"></script>
    <script src="{{ url_for('static', filename='js/foros.js') }}"></script>
    <!-- Init -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- ══════════════════ Mobile drawer logic ═══════════════ -->
    <script>
      function toggleDrawer() {
        const drawer = document.getElementById("navDrawer");
        const btn = document.getElementById("navHamburger");
        const open = drawer.classList.toggle("open");
        btn.classList.toggle("open", open);
        // Prevent body scroll when drawer is open
        document.body.style.overflow = open ? "hidden" : "";
      }
      function closeDrawer() {
        document.getElementById("navDrawer").classList.remove("open");
        document.getElementById("navHamburger").classList.remove("open");
        document.body.style.overflow = "";
      }
      // Close drawer when clicking outside
      document.addEventListener("click", function (e) {
        const drawer = document.getElementById("navDrawer");
        const hamburger = document.getElementById("navHamburger");
        if (
          drawer.classList.contains("open") &&
          !drawer.contains(e.target) &&
          !hamburger.contains(e.target)
        ) {
          closeDrawer();
        }
      });

      /**
       * Call this from your auth state logic to sync drawer + desktop nav.
       * Example: updateNavAuth({ loggedIn: true, initials: 'AB', name: 'Ana B.' })
       */
      function updateNavAuth({ loggedIn, initials = "", name = "" } = {}) {
        // Desktop
        document.getElementById("navUser").style.display = loggedIn
          ? "flex"
          : "none";
        document.getElementById("navAuth").style.display = loggedIn
          ? "none"
          : "flex";
        if (loggedIn) {
          document.getElementById("navAvatar").textContent = initials;
        }
        // Drawer
        document.getElementById("drawerUser").style.display = loggedIn
          ? "flex"
          : "none";
        document.getElementById("drawerLogout").style.display = loggedIn
          ? "block"
          : "none";
        document.getElementById("drawerAuth").style.display = loggedIn
          ? "none"
          : "flex";
        if (loggedIn) {
          document.getElementById("drawerAvatar").textContent = initials;
          document.getElementById("drawerUserName").textContent =
            name || "Mi perfil";
        }
      }
    </script>
  </body>
</html>
